<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>Roadie</title>
	<script src="sdpi-components.js"></script>
	<script src="server.js"></script>
	<link rel="stylesheet" href="server.css" />
</head>
<body>
	<sdpi-item label="Player">
		<sdpi-select setting="playerId" datasource="getPlayers" loading="Loading players…" placeholder="Choose a player" hot-reload></sdpi-select>
	</sdpi-item>
	<p class="note">Press to play or pause. On a Stream Deck+ dial: turn for volume, press or tap to play or pause.</p>
	<sdpi-item label="Text">
		<sdpi-checkbox setting="scroll" label="Scroll a long title or artist" default="true"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item label="Show">
		<sdpi-checkbox setting="hideName" label="Hide player name"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item>
		<sdpi-checkbox setting="hideCaption" label="Hide title and artist, artwork only"></sdpi-checkbox>
	</sdpi-item>

	<div id="server"></div>
</body>
</html>
