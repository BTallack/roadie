<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>Roadie</title>
	<script src="sdpi-components.js"></script>
	<script src="server.js"></script>
	<link rel="stylesheet" href="server.css" />
</head>
<body>
	<sdpi-item label="Player">
		<sdpi-select setting="playerId" datasource="getPlayers" loading="Loading players…" placeholder="Choose a player" hot-reload></sdpi-select>
	</sdpi-item>
	<sdpi-item label="Press">
		<sdpi-select setting="mode" default="toggle">
			<option value="toggle">Turn on or off</option>
			<option value="on">Always turn on</option>
			<option value="off">Always turn off</option>
		</sdpi-select>
	</sdpi-item>
	<p class="note">For players Music Assistant can switch on and off, such as Chromecast, AirPlay and Home Assistant players. Players without power control, such as Sonos, show the key greyed out.</p>
	<sdpi-item label="Show">
		<sdpi-checkbox setting="hideName" label="Hide player name"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item>
		<sdpi-checkbox setting="hideCaption" label="Hide caption, glyph only"></sdpi-checkbox>
	</sdpi-item>

	<div id="server"></div>
</body>
</html>
