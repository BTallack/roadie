<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>Roadie</title>
	<script src="sdpi-components.js"></script>
	<script src="server.js"></script>
	<link rel="stylesheet" href="server.css" />
</head>
<body>
	<sdpi-item label="Player">
		<sdpi-select setting="playerId" datasource="getPlayers" loading="Loading players…" placeholder="Choose a player" hot-reload></sdpi-select>
	</sdpi-item>
	<sdpi-item label="Skip">
		<sdpi-select setting="direction" default="back">
			<option value="back">Back</option>
			<option value="forward">Ahead</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="By">
		<sdpi-select setting="seconds" default="15">
			<option value="5">5 seconds</option>
			<option value="10">10 seconds</option>
			<option value="15">15 seconds</option>
			<option value="30">30 seconds</option>
			<option value="45">45 seconds</option>
			<option value="60">1 minute</option>
			<option value="120">2 minutes</option>
			<option value="300">5 minutes</option>
		</sdpi-select>
	</sdpi-item>
	<p class="note">Moves within the current track, handy for podcasts and audiobooks. Greyed out for live radio, which can't be skipped through.</p>
	<sdpi-item label="Show">
		<sdpi-checkbox setting="hideName" label="Hide player name"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item>
		<sdpi-checkbox setting="hideCaption" label="Hide caption, glyph only"></sdpi-checkbox>
	</sdpi-item>

	<div id="server"></div>
</body>
</html>
