<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>Roadie</title>
	<script src="sdpi-components.js"></script>
	<script src="server.js"></script>
	<link rel="stylesheet" href="server.css" />
</head>
<body>
	<sdpi-item label="Player">
		<sdpi-select setting="playerId" datasource="getPlayers" loading="Loading players…" placeholder="Choose a player" hot-reload></sdpi-select>
	</sdpi-item>
	<sdpi-item label="Join">
		<sdpi-select setting="targetId" datasource="getTargets" loading="Loading players…" placeholder="Choose a player or group" hot-reload></sdpi-select>
	</sdpi-item>
	<p class="note">Press joins the player to the chosen one (or its group); press again to leave. Only players the server says can group together are listed.</p>
	<sdpi-item label="Show">
		<sdpi-checkbox setting="hideName" label="Hide player name"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item>
		<sdpi-checkbox setting="hideCaption" label="Hide caption, glyph only"></sdpi-checkbox>
	</sdpi-item>

	<div id="server"></div>
</body>
</html>
