<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>Roadie</title>
	<script src="sdpi-components.js"></script>
	<script src="server.js"></script>
	<link rel="stylesheet" href="server.css" />
</head>
<body>
	<sdpi-item label="Player">
		<sdpi-select setting="playerId" datasource="getPlayers" loading="Loading players…" placeholder="Choose a player" hot-reload></sdpi-select>
	</sdpi-item>
	<sdpi-item label="Key">
		<sdpi-select setting="mode" default="up">
			<option value="up">Volume up</option>
			<option value="down">Volume down</option>
			<option value="mute">Mute / unmute</option>
			<option value="level">Current volume (display only)</option>
			<option value="level_mute">Current volume, press to mute</option>
			<option value="set">Set to a level</option>
		</sdpi-select>
	</sdpi-item>
	<div id="preset-fields" hidden>
	<sdpi-item label="Level">
		<sdpi-range setting="preset" min="0" max="100" step="1" default="30" showlabels></sdpi-range>
	</sdpi-item>
	<p class="note">Lights green while the player is at this level.</p>
	</div>
	<sdpi-item label="Icon style">
		<sdpi-select setting="style" default="waves">
			<option value="waves">Sound waves: one for down, three for up, none for mute</option>
			<option value="signs">Plus and minus signs</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Show">
		<sdpi-checkbox setting="hideName" label="Hide player name"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item>
		<sdpi-checkbox setting="hideCaption" label="Hide caption"></sdpi-checkbox>
	</sdpi-item>
	<p class="note">Up and down step by the server's volume step. On a Stream Deck+ dial the key setting is ignored: turn for volume, press or tap to mute.</p>

	<div id="server"></div>
	<script>
		// The level slider only matters for "Set to a level".
		(() => {
			const client = SDPIComponents.streamDeckClient;
			const apply = (settings) => (document.getElementById("preset-fields").hidden = !(settings && settings.mode === "set"));
			client.didReceiveSettings.subscribe((ev) => apply(ev && ev.payload && ev.payload.settings));
			document.addEventListener("DOMContentLoaded", () => {
				client.getSettings().then((payload) => apply(payload && payload.settings)).catch(() => {});
				document.querySelector('sdpi-select[setting="mode"]').addEventListener("valuechange", (ev) => apply({ mode: ev.target.value }));
			});
		})();
	</script>
</body>
</html>
