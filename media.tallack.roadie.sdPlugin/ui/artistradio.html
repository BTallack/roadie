<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>Roadie</title>
	<script src="sdpi-components.js"></script>
	<script src="server.js"></script>
	<link rel="stylesheet" href="server.css" />
</head>
<body>
	<sdpi-item label="Search">
		<sdpi-textfield id="search" placeholder="Type to narrow the artists"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Artist">
		<sdpi-select setting="artistUri" datasource="getArtists" loading="Loading artists…" placeholder="Choose an artist" hot-reload></sdpi-select>
	</sdpi-item>
	<sdpi-item label="Player">
		<sdpi-select setting="playerId" datasource="getPlayers" loading="Loading players…" placeholder="Choose a player" hot-reload></sdpi-select>
	</sdpi-item>
	<p class="note">Starts a never-ending mix seeded by the artist, the way "start radio" does in Music Assistant. Needs Music Assistant 2.9 or later.</p>
	<sdpi-item label="Load as">
		<sdpi-select setting="enqueue" default="replace">
			<option value="replace">Replace the queue and play</option>
			<option value="play">Play now, keep the queue</option>
			<option value="next">Play next</option>
			<option value="add">Add to the end</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Show">
		<sdpi-checkbox setting="hideName" label="Hide player name"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item>
		<sdpi-checkbox setting="hideCaption" label="Hide artist name, artwork only"></sdpi-checkbox>
	</sdpi-item>

	<div id="server"></div>
	<script>
		// Search narrows the picker on the server, so libraries of thousands stay usable.
		(() => {
			const client = SDPIComponents.streamDeckClient;
			let timer;
			document.addEventListener("DOMContentLoaded", () => {
				const field = document.getElementById("search");
				const select = document.querySelector("sdpi-select[datasource]");
				const ask = (text) => client.send("sendToPlugin", { event: select.getAttribute("datasource"), search: text });
				const changed = (ev) => {
					const input = ev.composedPath ? ev.composedPath()[0] : ev.target;
					const text = (input && typeof input.value === "string" ? input.value : field.value || "").trim();
					clearTimeout(timer);
					timer = setTimeout(() => ask(text), 300);
				};
				field.addEventListener("input", changed);
				field.addEventListener("valuechange", changed);
			});
		})();
	</script>
</body>
</html>
